.spinning-circle-image {
  /* Step 1: Make it a perfect square */
  width: 200px;
  height: 200px;
  
  /* Step 2: Crop it into a circle */
  border-radius: 50%;
  
  /* Step 3: Prevent distortion if the original image isn't square */
  object-fit: cover;
  
  /* Step 4: Apply the spin animation */
  animation: spin 3s linear infinite;
}

/* Step 5: Define the 360-degree rotation path */
@keyframes spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
